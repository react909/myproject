[alembic]
script_location = alembic

# No sqlalchemy.url here on purpose: the app injects the target DSN at
# runtime (see app/core/migrations.py), since the same alembic.ini is used
# for both the Postgres and SQLite targets. Running the alembic CLI by hand
# during development falls back to Settings().postgres_dsn — see env.py.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
